<!--
  =========================================================================
  SETUP — read this before you upload the file anywhere.

  DEFAULT LINK (no ?league= in the URL) is gated by CONFIG_URL below —
  one shared access code/on-off switch, same as a single-league setup.

  MULTIPLE LEAGUES: give each league its own link, own access code, own
  on/off switch, all pointing at this same deployed file:

  1. Create a PUBLIC gist per league, e.g. "chalk-line-access-<league>.json":
             { "open": true, "code": "yourcode" }
     Copy its "Raw" URL.

  2. Add that league to the LEAGUES_URL directory gist (one JSON file
     mapping league slug -> that raw URL), e.g.:
             { "riverside": "https://gist.githubusercontent.com/.../raw/...json" }

  3. Send that league the link: this page's URL + "?league=riverside".
     They'll be gated by their own gist — independent of every other league.

  Onboarding a new league from here on is just steps 1-2 above (two gist
  edits) — no code change or redeploy needed.

  PUBLISHING A SCHEDULE so it's the same for everyone who opens the link
  (this is what makes a printed PDF match what people see on the page):

  1. In the app, generate the final schedule, then click "Copy schedule for
     handoff". That copies the full schedule as JSON to the clipboard.

  2. Create (or edit) a PUBLIC gist for that league, e.g.
     "chalk-line-schedule-<league>.json", and paste that JSON in as its
     content. Copy its "Raw" URL (the no-revision-hash form, so future edits
     to this same gist are picked up automatically — see the existing
     CONFIG_URL/LEAGUES_URL above for the URL shape to match).

  3. Add that league to the SCHEDULES_URL directory gist below (same
     slug -> raw URL mapping style as LEAGUES_URL).

  From then on, that league's link always opens straight to that exact
  schedule — no "Generate schedule" click, no risk of a different random
  draw on someone else's device. To change the schedule later (a team drops
  or is added mid-season), regenerate/amend in the app, "Copy schedule for
  handoff" again, and paste the new JSON over the gist's old content —
  no redeploy of this file needed, just that one gist edit.

  Heads up: this is a light front-door, not a security system. Someone who
  opens their browser's dev tools could find the config URLs and codes. It's
  meant to keep casual link-sharing under control during testing/trials, not
  to protect anything sensitive.
  =========================================================================
-->

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ---------- icons (plain SVG, no external icon library needed) ----------
const Icon = {
  Lock: () => (
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" strokeWidth="1.8">
      <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
  ),
};

// ---------- scheduling helpers ----------
const uid = () => Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toISOString().slice(0, 10);
const addDays = (isoDate, days) => {
  const d = new Date(isoDate + "T00:00:00");
  d.setDate(d.getDate() + Math.round(days));
  return d;
};
const formatDate = (d) => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

// Walks forward from startDate at the given weekly cadence, skipping any
// date that falls in blackoutSet (e.g. holiday weeks), until `count` play
// dates have been collected.
function computePlayDates(startDate, matchesPerWeek, blackoutSet, count) {
  const dates = [];
  let stepIndex = 0;
  while (dates.length < count && stepIndex < count * 4 + 52) {
    const dayOffset = stepIndex * (7 / matchesPerWeek);
    const d = addDays(startDate, dayOffset);
    stepIndex++;
    if (blackoutSet.has(d.toISOString().slice(0, 10))) continue;
    dates.push(d);
  }
  return dates;
}

const wantsHome = (state) => {
  const balance = state.awayCount - state.homeCount;
  const streakBonus = state.lastVenue === "away" ? 0.5 : state.lastVenue === "home" ? -0.5 : 0;
  return balance + streakBonus;
};

function generateRoundRobinPairs(teamIds) {
  const hasBye = teamIds.length % 2 !== 0;
  let arr = hasBye ? [...teamIds, null] : [...teamIds];
  const n = arr.length;
  const half = n / 2;
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < half; i++) {
      const a = arr[i];
      const b = arr[n - 1 - i];
      if (a !== null && b !== null) pairs.push([a, b]);
    }
    rounds.push(pairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  return rounds;
}

function backtrackAssign(freeMatches, teamsById, capacity, teamState) {
  const cap = { ...capacity };
  const results = new Array(freeMatches.length);
  const tightness = (m) => (cap[teamsById[m.a].barId] ?? 0) + (cap[teamsById[m.b].barId] ?? 0);
  const order = freeMatches.map((m, i) => ({ m, i })).sort((x, y) => tightness(x.m) - tightness(y.m));

  function optionOrder(m) {
    const scoreA = wantsHome(teamState[m.a]);
    const scoreB = wantsHome(teamState[m.b]);
    return scoreA >= scoreB ? [m.a, m.b] : [m.b, m.a];
  }

  function solve(pos) {
    if (pos === order.length) return true;
    const { m, i } = order[pos];
    const [first, second] = optionOrder(m);
    for (const hostId of [first, second]) {
      const bar = teamsById[hostId].barId;
      if ((cap[bar] ?? 0) > 0) {
        cap[bar] -= 1;
        results[i] = { a: m.a, b: m.b, hostId };
        if (solve(pos + 1)) return true;
        cap[bar] += 1;
        results[i] = undefined;
      }
    }
    return false;
  }

  const ok = solve(0);
  if (!ok) {
    order.forEach(({ m, i }) => {
      if (!results[i]) {
        const [first] = optionOrder(m);
        results[i] = { a: m.a, b: m.b, hostId: first };
      }
    });
  }
  return { ok, matches: results };
}

function buildSchedule(teams, bars, settings) {
  if (teams.length < 2) return { error: "Add at least two teams before generating a schedule." };
  if (settings.format === "random") {
    const weeksCount = Math.max(1, Number(settings.weeks) || 1);
    return buildRandomSchedule(teams, bars, weeksCount);
  }
  return buildRoundRobinSchedule(teams, bars, settings);
}

function buildRoundRobinSchedule(teams, bars, settings) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const singleRounds = generateRoundRobinPairs(teams.map((t) => t.id));
  const sequence = settings.format === "doubleRound" ? [...singleRounds, ...singleRounds] : singleRounds;

  const teamState = {};
  teams.forEach((t) => (teamState[t.id] = { homeCount: 0, awayCount: 0, lastVenue: null }));
  const pairHistory = {};
  const weeks = [];
  const issues = [];

  sequence.forEach((pairs, idx) => {
    const leg = settings.format === "doubleRound" ? (idx < singleRounds.length ? 1 : 2) : 1;
    const capacityLeft = {};
    bars.forEach((b) => (capacityLeft[b.id] = b.tables));

    const decided = [];
    const free = [];
    pairs.forEach(([a, b]) => {
      const ta = teamsById[a], tb = teamsById[b];
      const key = [a, b].sort().join("|");
      if (leg === 2 && pairHistory[key]) {
        const firstHost = pairHistory[key];
        const hostId = firstHost === a ? b : a;
        decided.push({ a, b, hostId, sharedBar: ta.barId === tb.barId });
      } else if (ta.barId === tb.barId) {
        decided.push({ a, b, hostId: null, sharedBar: true });
      } else {
        free.push({ a, b });
      }
    });

    decided.forEach((m) => {
      if (m.hostId) capacityLeft[teamsById[m.hostId].barId] = (capacityLeft[teamsById[m.hostId].barId] ?? 0) - 1;
    });
    decided.filter((m) => !m.hostId).forEach((m) => {
      capacityLeft[teamsById[m.a].barId] = (capacityLeft[teamsById[m.a].barId] ?? 0) - 1;
      const prefA = wantsHome(teamState[m.a]);
      const prefB = wantsHome(teamState[m.b]);
      m.hostId = prefA >= prefB ? m.a : m.b;
    });

    const assigned = backtrackAssign(free, teamsById, capacityLeft, teamState);
    if (!assigned.ok) issues.push(`Round ${idx + 1}: table limits were tight — one match may need a manual swap.`);

    const allMatches = [...decided, ...assigned.matches];
    const barUsage = {};
    bars.forEach((b) => (barUsage[b.id] = 0));
    allMatches.forEach((m) => { barUsage[teamsById[m.hostId].barId] = (barUsage[teamsById[m.hostId].barId] ?? 0) + 1; });

    allMatches.forEach((m) => {
      const hostId = m.hostId;
      const guestId = m.a === hostId ? m.b : m.a;
      teamState[hostId].homeCount += 1; teamState[hostId].lastVenue = "home";
      teamState[guestId].awayCount += 1; teamState[guestId].lastVenue = "away";
      const key = [m.a, m.b].sort().join("|");
      if (!pairHistory[key]) pairHistory[key] = hostId;
    });

    const involved = new Set();
    pairs.forEach(([a, b]) => { involved.add(a); involved.add(b); });
    const byeTeam = teams.find((t) => !involved.has(t.id));

    weeks.push({
      round: idx + 1, leg,
      matches: allMatches.map((m) => ({
        homeId: m.hostId, awayId: m.a === m.hostId ? m.b : m.a,
        barId: teamsById[m.hostId].barId, sharedBar: !!m.sharedBar,
      })),
      byeId: byeTeam ? byeTeam.id : null,
      barUsage,
    });
  });

  return { weeks, teamState, issues };
}

// "Random matchups" — not everyone plays everyone, but no pair should ever
// repeat. A full round-robin (generateRoundRobinPairs) already guarantees
// every pair meets exactly once across all of its rounds; taking a shuffled
// subset of those rounds gives a random-feeling season that still can never
// repeat a matchup, and naturally leaves some pairs unplayed if weeksCount
// is fewer than the full round-robin length. Bye rotates fairly for the same
// reason: each team sits out exactly one round across the full round-robin.
// The per-week home/away pick (wantsHome, below) is a greedy heuristic with
// no lookahead: it only knows each team's running total at the moment its
// week is processed, and bar-capacity limits (many bars here have exactly
// one table shared by two teams) can force a pick against that heuristic
// anyway. Over a full season that drift can add up to a real gap for one
// or two teams even though most land close to even. Rather than accept
// whatever a single random shuffle produces, this runs several independent
// shuffles and keeps the one where every team ends up closest to a 50/50
// split, since the round order is the only randomness involved.
function buildRandomScheduleAttempt(teams, bars, allRounds, targetWeeks) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const shuffled = [...allRounds];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const sequence = shuffled.slice(0, targetWeeks);

  const teamState = {};
  teams.forEach((t) => (teamState[t.id] = { homeCount: 0, awayCount: 0, lastVenue: null }));
  const weeks = [];
  const issues = [];

  sequence.forEach((pairs, idx) => {
    const capacityLeft = {};
    bars.forEach((b) => (capacityLeft[b.id] = b.tables));

    const decided = [];
    const free = [];
    pairs.forEach(([a, b]) => {
      const ta = teamsById[a], tb = teamsById[b];
      if (ta.barId === tb.barId) {
        decided.push({ a, b, hostId: null, sharedBar: true });
      } else {
        free.push({ a, b });
      }
    });

    decided.forEach((m) => {
      const prefA = wantsHome(teamState[m.a]);
      const prefB = wantsHome(teamState[m.b]);
      m.hostId = prefA >= prefB ? m.a : m.b;
      capacityLeft[teamsById[m.hostId].barId] = (capacityLeft[teamsById[m.hostId].barId] ?? 0) - 1;
    });

    const assigned = backtrackAssign(free, teamsById, capacityLeft, teamState);
    if (!assigned.ok) issues.push(`Week ${idx + 1}: table limits were tight — one match may need a manual swap.`);

    const allMatches = [...decided, ...assigned.matches];
    const barUsage = {};
    bars.forEach((b) => (barUsage[b.id] = 0));
    allMatches.forEach((m) => { barUsage[teamsById[m.hostId].barId] = (barUsage[teamsById[m.hostId].barId] ?? 0) + 1; });

    allMatches.forEach((m) => {
      const hostId = m.hostId;
      const guestId = m.a === hostId ? m.b : m.a;
      teamState[hostId].homeCount += 1; teamState[hostId].lastVenue = "home";
      teamState[guestId].awayCount += 1; teamState[guestId].lastVenue = "away";
    });

    const involved = new Set();
    pairs.forEach(([a, b]) => { involved.add(a); involved.add(b); });
    const byeTeam = teams.find((t) => !involved.has(t.id));

    weeks.push({
      round: idx + 1, leg: 1,
      matches: allMatches.map((m) => ({
        homeId: m.hostId, awayId: m.a === m.hostId ? m.b : m.a,
        barId: teamsById[m.hostId].barId, sharedBar: !!m.sharedBar,
      })),
      byeId: byeTeam ? byeTeam.id : null,
      barUsage,
    });
  });

  return { weeks, teamState, issues };
}

const homeAwayBalanceScore = (teamState) => {
  let maxAbs = 0, sumSq = 0;
  Object.values(teamState).forEach((s) => {
    const diff = s.homeCount - s.awayCount;
    maxAbs = Math.max(maxAbs, Math.abs(diff));
    sumSq += diff * diff;
  });
  return { maxAbs, sumSq };
};

// Trying several round shuffles (above) only gets so far, since the
// wantsHome heuristic behaves similarly regardless of processing order and
// bar capacity can force its hand anyway. This directly targets whatever
// imbalance is left: for any match where the home team is meaningfully more
// home-heavy than the away team is away-heavy, swap who hosts: free when
// both teams share a bar (nothing about capacity changes), otherwise
// only when the away team's bar actually has a free table that week. Each
// swap strictly shrinks the gap between that pair, so this always
// terminates rather than flip-flopping.
// Swaps who hosts a match: free at a shared bar (nothing about capacity
// changes), otherwise only if the new host's bar actually has a free
// table that week. Shared by both repair passes below.
function flipMatchHost(m, week, teamState, teamsById, barsById) {
  const hostId = m.homeId, guestId = m.awayId;
  const newHostId = guestId, newGuestId = hostId;
  const newBarId = teamsById[newHostId].barId;
  const oldBarId = m.barId;
  if (!m.sharedBar) {
    const cap = barsById[newBarId]?.tables ?? 0;
    const used = week.barUsage[newBarId] ?? 0;
    if (used >= cap) return false;
  }
  const hs = teamState[hostId], gs = teamState[guestId];
  m.homeId = newHostId; m.awayId = newGuestId; m.barId = newBarId;
  hs.homeCount -= 1; hs.awayCount += 1;
  gs.homeCount += 1; gs.awayCount -= 1;
  if (!m.sharedBar) {
    week.barUsage[oldBarId] = (week.barUsage[oldBarId] ?? 0) - 1;
    week.barUsage[newBarId] = (week.barUsage[newBarId] ?? 0) + 1;
  }
  return true;
}

function cloneScheduleResult(result) {
  const teamState = {};
  Object.entries(result.teamState).forEach(([id, s]) => { teamState[id] = { ...s }; });
  const weeks = result.weeks.map((w) => ({ ...w, matches: w.matches.map((m) => ({ ...m })), barUsage: { ...w.barUsage } }));
  return { weeks, teamState, issues: result.issues };
}

// Trying several round shuffles (above) only gets so far, since the
// wantsHome heuristic behaves similarly regardless of processing order and
// bar capacity can force its hand anyway. This directly targets whatever
// imbalance is left: for any match where the home team is meaningfully more
// home-heavy than the away team is away-heavy, swap who hosts. Each swap
// strictly shrinks the gap between that pair, so this always terminates
// rather than flip-flopping.
function repairHomeAwayBalance(result, teams, bars, lockedBeforeRound = 0) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const barsById = Object.fromEntries(bars.map((b) => [b.id, b]));
  const { weeks, teamState, issues } = cloneScheduleResult(result);

  let improvedAny = true;
  let guard = 0;
  while (improvedAny && guard < 1000) {
    improvedAny = false;
    guard++;
    for (const week of weeks) {
      if (week.round < lockedBeforeRound) continue; // never touch already-printed weeks
      for (const m of week.matches) {
        const hs = teamState[m.homeId], gs = teamState[m.awayId];
        const hostDiff = hs.homeCount - hs.awayCount;
        const guestDiff = gs.homeCount - gs.awayCount;
        if (hostDiff <= guestDiff + 1) continue;
        if (flipMatchHost(m, week, teamState, teamsById, barsById)) improvedAny = true;
      }
    }
  }

  return { weeks, teamState, issues };
}

// A team can be balanced over the season and still play home (or away)
// several weeks running: home in weeks 1-2-3 then away 4-5-6 nets out even,
// but nobody wants to drive to every match for three weeks straight. This
// builds each team's actual week-by-week sequence of home/away (bye weeks
// don't count, since nothing happens that week), used below to find and
// fix those runs.
function buildTeamVenueTimelines(teams, weeks) {
  const timelines = {};
  teams.forEach((t) => (timelines[t.id] = []));
  weeks.forEach((week, weekIdx) => {
    week.matches.forEach((m) => {
      if (timelines[m.homeId]) timelines[m.homeId].push({ weekIdx, match: m, venue: "home" });
      if (timelines[m.awayId]) timelines[m.awayId].push({ weekIdx, match: m, venue: "away" });
    });
  });
  return timelines;
}

function venueExcess(venueSeq, maxStreak) {
  let excess = 0, streakStart = 0;
  for (let i = 1; i <= venueSeq.length; i++) {
    if (i < venueSeq.length && venueSeq[i] === venueSeq[streakStart]) continue;
    const len = i - streakStart;
    if (len > maxStreak) excess += len - maxStreak;
    streakStart = i;
  }
  return excess;
}

// A first balance-only pass (repairHomeAwayBalance, above) and a
// streak-only pass run one after the other just fight each other: the
// balance pass has no idea a flip it "corrects" was the one holding a
// streak in check, so it happily undoes it for a marginal balance gain.
// This scores every candidate flip on both concerns: a flip is only ever
// considered if it doesn't make balance worse (balance is already
// near-optimal coming in, so it isn't up for trade), and among the flips
// that pass that bar, it picks whichever most reduces streak excess.
// Fixing one thing can never quietly break the other.
function balanceExcess(diff) {
  return Math.max(0, Math.abs(diff) - 1);
}

function repairSchedule(result, teams, bars, lockedBeforeRound = 0, maxStreak = 1) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const barsById = Object.fromEntries(bars.map((b) => [b.id, b]));
  const { weeks, teamState, issues } = cloneScheduleResult(result);

  let guard = 0;
  let improved = true;
  while (improved && guard < 2000) {
    improved = false;
    guard++;

    const timelines = buildTeamVenueTimelines(teams, weeks);
    const posByTeam = {};
    teams.forEach((t) => {
      const map = new Map();
      timelines[t.id].forEach((entry, idx) => map.set(entry.match, idx));
      posByTeam[t.id] = map;
    });

    let bestDelta = 0;
    let bestMatch = null, bestWeek = null;

    for (const week of weeks) {
      if (week.round < lockedBeforeRound) continue;
      for (const m of week.matches) {
        const hostId = m.homeId, guestId = m.awayId;
        const hostSeq = timelines[hostId].map((e) => e.venue);
        const guestSeq = timelines[guestId].map((e) => e.venue);
        const hostPos = posByTeam[hostId].get(m);
        const guestPos = posByTeam[guestId].get(m);

        const streakBefore = venueExcess(hostSeq, maxStreak) + venueExcess(guestSeq, maxStreak);
        const hostSeqAfter = hostSeq.slice(); hostSeqAfter[hostPos] = "away";
        const guestSeqAfter = guestSeq.slice(); guestSeqAfter[guestPos] = "home";
        const streakAfter = venueExcess(hostSeqAfter, maxStreak) + venueExcess(guestSeqAfter, maxStreak);

        const hs = teamState[hostId], gs = teamState[guestId];
        const hostDiff = hs.homeCount - hs.awayCount, guestDiff = gs.homeCount - gs.awayCount;
        const balBefore = balanceExcess(hostDiff) + balanceExcess(guestDiff);
        const balAfter = balanceExcess(hostDiff - 2) + balanceExcess(guestDiff + 2);
        if (balAfter > balBefore) continue; // never trade balance away for a streak fix

        const delta = streakAfter - streakBefore;
        if (delta >= bestDelta) continue; // only strictly-improving moves count

        let capacityOk = m.sharedBar;
        if (!capacityOk) {
          const newBarId = teamsById[guestId].barId;
          const cap = barsById[newBarId]?.tables ?? 0;
          const used = week.barUsage[newBarId] ?? 0;
          capacityOk = used < cap;
        }
        if (capacityOk) { bestDelta = delta; bestMatch = m; bestWeek = week; }
      }
    }

    if (bestMatch) {
      flipMatchHost(bestMatch, bestWeek, teamState, teamsById, barsById);
      improved = true;
    }
  }

  return { weeks, teamState, issues };
}

function findStreakIssues(teams, weeks, maxStreak) {
  const timelines = buildTeamVenueTimelines(teams, weeks);
  const issues = [];
  teams.forEach((t) => {
    const timeline = timelines[t.id];
    let streakStart = 0;
    for (let i = 1; i <= timeline.length; i++) {
      if (i < timeline.length && timeline[i].venue === timeline[streakStart].venue) continue;
      const streakLen = i - streakStart;
      if (streakLen > maxStreak) {
        issues.push(`${t.name}: ${streakLen} ${timeline[streakStart].venue} games in a row, since table limits at a shared bar made it unavoidable.`);
      }
      streakStart = i;
    }
  });
  return issues;
}

// Who's home each week is already decided and already balanced by this
// point, so the only thing left to fix is which CALENDAR WEEK each
// already-decided round lands in. Swapping which round happens in week 6
// vs week 19 changes nothing about who plays whom, who hosts, or any bar's
// capacity that week; it only changes the sequence a team experiences
// their already-fixed home/away pattern in. That makes this the safest
// possible lever for streaks: it can only help, never disturb balance or
// capacity, so it runs before the host-flipping repair, not after.
function excessForWeekContent(contentByIdx, teams, maxStreak) {
  const timelines = {};
  teams.forEach((t) => (timelines[t.id] = []));
  contentByIdx.forEach((content) => {
    content.matches.forEach((m) => {
      if (timelines[m.homeId]) timelines[m.homeId].push("home");
      if (timelines[m.awayId]) timelines[m.awayId].push("away");
    });
  });
  let total = 0;
  teams.forEach((t) => { total += venueExcess(timelines[t.id], maxStreak); });
  return total;
}

// Building the order left-to-right, always placing next whichever
// still-unplaced round extends the fewest active streaks, works far
// better for this "spread repeats apart" shape of problem than shuffling
// an already-fixed order and hoping a swap helps, the same idea as a task
// scheduler spacing out repeated work instead of clumping it. Locked
// (already-printed) weeks seed the starting streaks but are never
// themselves moved. Ties are broken randomly so multiple attempts (below)
// explore different orderings.
function constructWeekOrderOnce(weeks, teams, swappableIdx) {
  const result = weeks.map((w) => ({ ...w }));
  const swappableSet = new Set(swappableIdx);
  const state = {};
  teams.forEach((t) => { state[t.id] = { lastVenue: null, streak: 0 }; });

  const applyToState = (matches) => {
    matches.forEach((m) => {
      const hs = state[m.homeId];
      if (hs) { hs.streak = hs.lastVenue === "home" ? hs.streak + 1 : 1; hs.lastVenue = "home"; }
      const gs = state[m.awayId];
      if (gs) { gs.streak = gs.lastVenue === "away" ? gs.streak + 1 : 1; gs.lastVenue = "away"; }
    });
  };

  // Seed state from any locked prefix so streaks spanning the boundary count.
  result.forEach((w, idx) => { if (!swappableSet.has(idx)) applyToState(w.matches); });

  let pool = swappableIdx.map((i) => ({ matches: result[i].matches, byeId: result[i].byeId, barUsage: result[i].barUsage }));

  swappableIdx.forEach((slot) => {
    let bestBadness = Infinity, ties = [];
    pool.forEach((content, idx) => {
      let badness = 0;
      content.matches.forEach((m) => {
        const hs = state[m.homeId];
        if (hs && hs.lastVenue === "home") badness += hs.streak;
        const gs = state[m.awayId];
        if (gs && gs.lastVenue === "away") badness += gs.streak;
      });
      if (badness < bestBadness) { bestBadness = badness; ties = [idx]; }
      else if (badness === bestBadness) { ties.push(idx); }
    });
    const chosenIdx = ties[Math.floor(Math.random() * ties.length)];
    const chosen = pool.splice(chosenIdx, 1)[0];
    result[slot] = { ...result[slot], matches: chosen.matches, byeId: chosen.byeId, barUsage: chosen.barUsage };
    applyToState(chosen.matches);
  });

  return result;
}

function reorderWeeksToReduceStreaks(weeks, teams, maxStreak = 1, lockedBeforeRound = 0) {
  const swappableIdx = weeks.map((w, i) => i).filter((i) => weeks[i].round >= lockedBeforeRound);
  if (swappableIdx.length < 2) return weeks;

  const ATTEMPTS = 40;
  let best = null, bestExcess = null;
  for (let n = 0; n < ATTEMPTS; n++) {
    const attempt = constructWeekOrderOnce(weeks, teams, swappableIdx);
    const excess = excessForWeekContent(attempt.map((w) => ({ matches: w.matches })), teams, maxStreak);
    if (best === null || excess < bestExcess) { best = attempt; bestExcess = excess; }
    if (bestExcess === 0) break;
  }
  return best;
}

function buildRandomSchedule(teams, bars, weeksCount) {
  const allRounds = generateRoundRobinPairs(teams.map((t) => t.id));
  const targetWeeks = Math.min(weeksCount, allRounds.length);
  const rangeIssue = weeksCount > allRounds.length
    ? [`With ${teams.length} teams, only ${allRounds.length} weeks are possible without repeating a matchup — showing ${allRounds.length} weeks instead of ${weeksCount}.`]
    : [];

  const ATTEMPTS = 150;
  let best = null;
  let bestScore = null;
  for (let n = 0; n < ATTEMPTS; n++) {
    const result = buildRandomScheduleAttempt(teams, bars, allRounds, targetWeeks);
    const score = homeAwayBalanceScore(result.teamState);
    if (!best || score.maxAbs < bestScore.maxAbs || (score.maxAbs === bestScore.maxAbs && score.sumSq < bestScore.sumSq)) {
      best = result;
      bestScore = score;
    }
    if (bestScore.maxAbs <= 1) break; // every team within one game of even — good enough
  }

  let repaired = repairHomeAwayBalance(best, teams, bars);
  repaired.weeks = reorderWeeksToReduceStreaks(repaired.weeks, teams, 1);
  repaired = repairSchedule(repaired, teams, bars);
  const streakIssues = findStreakIssues(teams, repaired.weeks, 2);
  return { weeks: repaired.weeks, teamState: repaired.teamState, issues: [...rangeIssue, ...repaired.issues, ...streakIssues] };
}

// ---------- mid-season amendments (add/drop a team without touching
// weeks already printed/played) ----------
const pairKey = (a, b) => [a, b].sort().join("|");

// Finds one week's worth of pairings for the *current* roster that avoids
// every pair in usedPairs, which includes both the locked weeks being kept
// AND every pair already regenerated for later weeks in this same run.
// Unlike the full-round-robin trick (which only works for a fixed, unchanging
// roster), this has to search per week since the roster can change mid-season.
function findNoRepeatWeek(teamIds, usedPairs, byeCounts, maxAttempts = 40) {
  const byeOrder = [...teamIds].sort((a, b) => (byeCounts[a] || 0) - (byeCounts[b] || 0));
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const byeId = byeOrder[attempt % byeOrder.length];
    const shuffled = teamIds.filter((id) => id !== byeId);
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const used = new Set();
    const pairs = [];
    const backtrack = (pos) => {
      while (pos < shuffled.length && used.has(shuffled[pos])) pos++;
      if (pos >= shuffled.length) return true;
      const a = shuffled[pos];
      used.add(a);
      const candidates = shuffled.filter((b) => b !== a && !used.has(b) && !usedPairs.has(pairKey(a, b)));
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }
      for (const b of candidates) {
        used.add(b);
        pairs.push([a, b]);
        if (backtrack(pos + 1)) return true;
        pairs.pop();
        used.delete(b);
      }
      used.delete(a);
      return false;
    };
    if (backtrack(0)) return { pairs, byeId };
  }
  return null;
}

// Keeps every week before fromWeekNumber exactly as-is, and rebuilds
// fromWeekNumber onward using the current team/bar list, carrying forward
// bye counts and home/away balance from the kept weeks so fairness continues
// rather than resetting. Same greedy-heuristic caveat as buildRandomSchedule
// above, so buildContinuationSchedule below tries this multiple times and
// keeps the fairest result.
function buildContinuationAttempt(existingWeeks, fromWeekNumber, teams, bars) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const teamIds = teams.map((t) => t.id);
  const keptWeeks = existingWeeks.filter((w) => w.round < fromWeekNumber);
  const totalWeeks = existingWeeks.length;

  const usedPairs = new Set();
  const byeCounts = {};
  const teamState = {};
  teamIds.forEach((id) => {
    byeCounts[id] = 0;
    teamState[id] = { homeCount: 0, awayCount: 0, lastVenue: null };
  });

  keptWeeks.forEach((w) => {
    w.matches.forEach((m) => {
      usedPairs.add(pairKey(m.homeId, m.awayId));
      if (teamState[m.homeId]) { teamState[m.homeId].homeCount += 1; teamState[m.homeId].lastVenue = "home"; }
      if (teamState[m.awayId]) { teamState[m.awayId].awayCount += 1; teamState[m.awayId].lastVenue = "away"; }
    });
    if (w.byeId != null && byeCounts[w.byeId] !== undefined) byeCounts[w.byeId] += 1;
  });

  const weeks = [...keptWeeks];
  const issues = [];

  for (let roundNum = fromWeekNumber; roundNum <= totalWeeks; roundNum++) {
    const found = findNoRepeatWeek(teamIds, usedPairs, byeCounts);
    if (!found) {
      issues.push(`Week ${roundNum}: every remaining matchup for this roster has already been played, so regenerating stopped here. You may need to allow one repeat manually, or shorten the season.`);
      break;
    }
    const { pairs, byeId } = found;
    byeCounts[byeId] = (byeCounts[byeId] || 0) + 1;
    pairs.forEach(([a, b]) => usedPairs.add(pairKey(a, b)));

    const capacityLeft = {};
    bars.forEach((b) => (capacityLeft[b.id] = b.tables));
    const decided = [];
    const free = [];
    pairs.forEach(([a, b]) => {
      const ta = teamsById[a], tb = teamsById[b];
      if (ta.barId === tb.barId) decided.push({ a, b, hostId: null, sharedBar: true });
      else free.push({ a, b });
    });
    decided.forEach((m) => {
      const prefA = wantsHome(teamState[m.a]);
      const prefB = wantsHome(teamState[m.b]);
      m.hostId = prefA >= prefB ? m.a : m.b;
      capacityLeft[teamsById[m.hostId].barId] = (capacityLeft[teamsById[m.hostId].barId] ?? 0) - 1;
    });
    const assigned = backtrackAssign(free, teamsById, capacityLeft, teamState);
    if (!assigned.ok) issues.push(`Week ${roundNum}: table limits were tight — one match may need a manual swap.`);

    const allMatches = [...decided, ...assigned.matches];
    const barUsage = {};
    bars.forEach((b) => (barUsage[b.id] = 0));
    allMatches.forEach((m) => { barUsage[teamsById[m.hostId].barId] = (barUsage[teamsById[m.hostId].barId] ?? 0) + 1; });
    allMatches.forEach((m) => {
      const hostId = m.hostId;
      const guestId = m.a === hostId ? m.b : m.a;
      teamState[hostId].homeCount += 1; teamState[hostId].lastVenue = "home";
      teamState[guestId].awayCount += 1; teamState[guestId].lastVenue = "away";
    });

    weeks.push({
      round: roundNum, leg: 1,
      matches: allMatches.map((m) => ({
        homeId: m.hostId, awayId: m.a === m.hostId ? m.b : m.a,
        barId: teamsById[m.hostId].barId, sharedBar: !!m.sharedBar,
      })),
      byeId,
      barUsage,
    });
  }

  return { weeks, teamState, issues };
}

function buildContinuationSchedule(existingWeeks, fromWeekNumber, teams, bars) {
  const ATTEMPTS = 150;
  let best = null;
  let bestScore = null;
  for (let n = 0; n < ATTEMPTS; n++) {
    const result = buildContinuationAttempt(existingWeeks, fromWeekNumber, teams, bars);
    const score = homeAwayBalanceScore(result.teamState);
    if (!best || score.maxAbs < bestScore.maxAbs || (score.maxAbs === bestScore.maxAbs && score.sumSq < bestScore.sumSq)) {
      best = result;
      bestScore = score;
    }
    if (bestScore.maxAbs <= 1) break;
  }
  let repaired = repairHomeAwayBalance(best, teams, bars, fromWeekNumber);
  repaired.weeks = reorderWeeksToReduceStreaks(repaired.weeks, teams, 1, fromWeekNumber);
  repaired = repairSchedule(repaired, teams, bars, fromWeekNumber);
  const streakIssues = findStreakIssues(teams, repaired.weeks, 2);
  return { weeks: repaired.weeks, teamState: repaired.teamState, issues: [...repaired.issues, ...streakIssues] };
}

// ---------- main scheduler app ----------
function ChalkLineScheduler({ storageKey, leagueSlug }) {
  const [bars, setBars] = useState(seedBars);
  const [teams, setTeams] = useState(seedTeams);
  const [settings, setSettings] = useState({
    matchesPerWeek: 1,
    format: "random",
    startDate: "2026-09-10",
    weeks: 26,
    blackoutDates: ["2026-11-26", "2026-12-24", "2026-12-31"],
  });
  const [barName, setBarName] = useState("");
  const [barTables, setBarTables] = useState(1);
  const [teamName, setTeamName] = useState("");
  const [teamBar, setTeamBar] = useState("");
  const [schedule, setSchedule] = useState(null);
  const [notice, setNotice] = useState(null);
  const [blackoutInput, setBlackoutInput] = useState("");
  const [amendWeek, setAmendWeek] = useState("");
  const [teamArchive, setTeamArchive] = useState(() => Object.fromEntries(seedTeams.map((t) => [t.id, t])));
  const [published, setPublished] = useState(null); // null = not checked yet / none for this league

  useEffect(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.bars) setBars(parsed.bars);
        if (parsed.teams) setTeams(parsed.teams);
        if (parsed.teamArchive) setTeamArchive(parsed.teamArchive);
        if (parsed.settings) {
          // Season format is fixed to "random" — no UI offers the old
          // doubleRound/singleRound modes anymore, so force it here too in
          // case a config was saved before this was simplified.
          setSettings((prev) => ({ ...prev, ...parsed.settings, format: "random" }));
        }
        if (parsed.schedule) setSchedule(parsed.schedule);
      }
    } catch (e) { /* no saved config yet */ }
  }, [storageKey]);

  // If this league has a published schedule (see window.SCHEDULES_URL in the
  // setup comment at the top of the file), it's the shared source of truth:
  // it loads last, after any local draft above, so everyone who opens this
  // league's link (owner or operator, any device, no saved local state)
  // lands on the exact same schedule that was printed, no button click
  // needed. Use "Copy schedule for handoff" below to grab the JSON for a
  // new publish whenever the schedule changes.
  useEffect(() => {
    const configured = window.SCHEDULES_URL && !window.SCHEDULES_URL.includes("PASTE_YOUR");
    if (!configured) return;
    const slug = leagueSlug || "default";
    noCacheFetch(window.SCHEDULES_URL)
      .then((directory) => {
        const scheduleUrl = directory[slug];
        if (!scheduleUrl) return null;
        return noCacheFetch(scheduleUrl);
      })
      .then((data) => {
        if (!data) return;
        if (data.bars) setBars(data.bars);
        if (data.teams) setTeams(data.teams);
        if (data.teamArchive) setTeamArchive(data.teamArchive);
        if (data.settings) setSettings((prev) => ({ ...prev, ...data.settings, format: "random" }));
        if (data.schedule) setSchedule(data.schedule);
        setPublished({ publishedAt: data.publishedAt || null });
      })
      .catch(() => { /* no published schedule for this league, or fetch failed — local/default stands */ });
  }, [leagueSlug]);

  // Removing a team from the roster (drop mid-season) must not erase its name
  // from weeks that were already generated and printed against it, so every
  // team ever seen is kept here, and only the active roster below is used for
  // building future weeks.
  useEffect(() => {
    setTeamArchive((prev) => {
      let changed = false;
      const next = { ...prev };
      teams.forEach((t) => {
        const existing = next[t.id];
        if (!existing || existing.name !== t.name || existing.barId !== t.barId) {
          next[t.id] = t;
          changed = true;
        }
      });
      return changed ? next : prev;
    });
  }, [teams]);

  const barsById = useMemo(() => Object.fromEntries(bars.map((b) => [b.id, b])), [bars]);
  const rosterById = useMemo(() => Object.fromEntries(teams.map((t) => [t.id, t])), [teams]);
  const teamsById = useMemo(() => ({ ...teamArchive, ...rosterById }), [teamArchive, rosterById]);

  const flash = (msg) => { setNotice(msg); setTimeout(() => setNotice(null), 3200); };

  const addBar = () => {
    if (!barName.trim()) return;
    setBars((prev) => [...prev, { id: uid(), name: barName.trim(), tables: Math.max(1, Number(barTables) || 1) }]);
    setBarName(""); setBarTables(1);
  };
  const removeBar = (id) => {
    if (teams.some((t) => t.barId === id)) { flash("Move or remove that bar's teams first — a bar in use can't be deleted."); return; }
    setBars((prev) => prev.filter((b) => b.id !== id));
  };
  const addTeam = () => {
    if (!teamName.trim()) return;
    const barId = teamBar || bars[0]?.id;
    if (!barId) { flash("Add a bar before adding a team."); return; }
    setTeams((prev) => [...prev, { id: uid(), name: teamName.trim(), barId }]);
    setTeamName("");
  };
  const removeTeam = (id) => setTeams((prev) => prev.filter((t) => t.id !== id));

  const runGenerate = useCallback((teamOrder) => {
    const result = buildSchedule(teamOrder ?? teams, bars, settings);
    if (result.error) { flash(result.error); setSchedule(null); return; }
    setSchedule(result);
  }, [teams, bars, settings]);

  const shuffleAndGenerate = () => {
    const shuffled = [...teams];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    runGenerate(shuffled);
  };

  const amendSchedule = () => {
    if (!schedule || schedule.error) { flash("Generate a schedule first."); return; }
    const w = Number(amendWeek);
    if (!w || w < 1 || w > schedule.weeks.length) {
      flash(`Enter a week number between 1 and ${schedule.weeks.length}.`);
      return;
    }
    const result = buildContinuationSchedule(schedule.weeks, w, teams, bars);
    setSchedule(result);
    const keptCount = w - 1;
    flash(
      keptCount > 0
        ? `Weeks 1–${keptCount} left untouched. Weeks ${w}–${schedule.weeks.length} regenerated with your current teams.`
        : `Whole schedule regenerated with your current teams.`
    );
  };

  const saveConfig = () => {
    try {
      localStorage.setItem(storageKey, JSON.stringify({ bars, teams, teamArchive, settings, schedule }));
      flash("Setup saved to this browser. It'll be here next time you open this page here.");
    } catch (e) { flash("Couldn't save right now — try again in a moment."); }
  };

  const copyForHandoff = async () => {
    if (!schedule || schedule.error) { flash("Generate a schedule first."); return; }
    const payload = JSON.stringify({ bars, teams, teamArchive, settings, schedule, publishedAt: new Date().toISOString() }, null, 2);
    try {
      await navigator.clipboard.writeText(payload);
      flash("Copied. Send this to whoever publishes it, so every device shows this exact schedule.");
    } catch (e) {
      flash("Couldn't copy automatically. Open the browser console and copy chalkLineHandoffData instead.");
      window.chalkLineHandoffData = payload;
    }
  };

  const weeksGrouped = useMemo(() => {
    if (!schedule) return [];
    const blackoutSet = new Set(settings.blackoutDates || []);
    const playDates = computePlayDates(settings.startDate, settings.matchesPerWeek, blackoutSet, schedule.weeks.length);
    const perWeek = {};
    schedule.weeks.forEach((w, i) => {
      const weekIdx = Math.floor((w.round - 1) / settings.matchesPerWeek);
      if (!perWeek[weekIdx]) perWeek[weekIdx] = [];
      perWeek[weekIdx].push({ ...w, date: playDates[i] });
    });
    return Object.keys(perWeek).sort((a, b) => Number(a) - Number(b))
      .map((k) => ({ weekNumber: Number(k) + 1, nights: perWeek[k] }));
  }, [schedule, settings]);

  return (
    <div className="cl-app">
      <div className="cl-header">
        <p className="cl-title">Chalk Line</p>
        <p className="cl-subtitle">Home-and-away scheduling for pool leagues where bars share tables and teams share bars.</p>
      </div>
      <div className="cl-body">
        {notice && <div className="cl-notice">{notice}</div>}

        <div className="cl-grid-2">
          <div className="cl-section">
            <div className="cl-section-title">Bars &amp; tables</div>
            <div className="cl-card">
              {bars.length === 0 && <div className="cl-empty">Add the bars your teams play out of.</div>}
              {bars.map((b) => (
                <div className="cl-row" key={b.id}>
                  <div className="cl-row-main">
                    <span>{b.name}</span>
                    <span className="cl-tag">{b.tables} table{b.tables === 1 ? "" : "s"}</span>
                  </div>
                  <button className="cl-icon-btn" onClick={() => removeBar(b.id)}>✕</button>
                </div>
              ))}
              <div className="cl-form-row">
                <input className="cl-input cl-input-name" placeholder="Bar name" value={barName}
                  onChange={(e) => setBarName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addBar()} />
                <input type="number" min="1" className="cl-input cl-input-num" value={barTables}
                  onChange={(e) => setBarTables(e.target.value)} />
                <button className="cl-btn cl-btn-ghost" onClick={addBar}>+ Add</button>
              </div>
            </div>
          </div>

          <div className="cl-section">
            <div className="cl-section-title">Teams</div>
            <div className="cl-card">
              {teams.length === 0 && <div className="cl-empty">Add teams and pick which bar each one calls home.</div>}
              {teams.map((t) => (
                <div className="cl-row" key={t.id}>
                  <div className="cl-row-main">
                    <span>{t.name}</span>
                    <span className="cl-tag">{barsById[t.barId]?.name ?? "no bar"}</span>
                  </div>
                  <button className="cl-icon-btn" onClick={() => removeTeam(t.id)}>✕</button>
                </div>
              ))}
              <div className="cl-form-row">
                <input className="cl-input cl-input-name" placeholder="Team name" value={teamName}
                  onChange={(e) => setTeamName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTeam()} />
                <select className="cl-select" value={teamBar} onChange={(e) => setTeamBar(e.target.value)}>
                  <option value="">Home bar…</option>
                  {bars.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
                <button className="cl-btn cl-btn-ghost" onClick={addTeam}>+ Add</button>
              </div>
            </div>
          </div>
        </div>

        <div className="cl-section">
          <div className="cl-section-title">Season settings</div>
          <div className="cl-card cl-settings-row">
            <div className="cl-settings-group">
              <span className="cl-settings-label">Nights per week</span>
              <div className="cl-radio-set">
                <label className="cl-radio-opt"><input type="radio" checked={settings.matchesPerWeek === 1}
                  onChange={() => setSettings((s) => ({ ...s, matchesPerWeek: 1 }))} /> Weekly</label>
                <label className="cl-radio-opt"><input type="radio" checked={settings.matchesPerWeek === 2}
                  onChange={() => setSettings((s) => ({ ...s, matchesPerWeek: 2 }))} /> Twice a week</label>
              </div>
            </div>
            <div className="cl-settings-group">
              <span className="cl-settings-label">First match night</span>
              <input type="date" className="cl-input" value={settings.startDate}
                onChange={(e) => setSettings((s) => ({ ...s, startDate: e.target.value }))} />
            </div>
            <div className="cl-settings-group">
              <span className="cl-settings-label">Number of weeks</span>
              <input type="number" min="1" className="cl-input cl-input-num" value={settings.weeks}
                onChange={(e) => setSettings((s) => ({ ...s, weeks: e.target.value }))} />
            </div>
          </div>
          <div className="cl-card" style={{ marginTop: 12 }}>
            <span className="cl-settings-label">Weeks off (holidays, etc.)</span>
            <div className="cl-form-row" style={{ flexWrap: "wrap", marginTop: 8 }}>
              {(settings.blackoutDates || []).map((d) => (
                <span className="cl-tag" key={d} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  {d}
                  <button type="button" className="cl-icon-btn" style={{ padding: "0 2px" }}
                    onClick={() => setSettings((s) => ({ ...s, blackoutDates: s.blackoutDates.filter((x) => x !== d) }))}>✕</button>
                </span>
              ))}
            </div>
            <div className="cl-form-row">
              <input type="date" className="cl-input" value={blackoutInput}
                onChange={(e) => setBlackoutInput(e.target.value)} />
              <button type="button" className="cl-btn cl-btn-ghost" onClick={() => {
                if (!blackoutInput) return;
                setSettings((s) => ({
                  ...s,
                  blackoutDates: [...new Set([...(s.blackoutDates || []), blackoutInput])].sort(),
                }));
                setBlackoutInput("");
              }}>+ Add</button>
            </div>
          </div>
        </div>

        <div className="cl-actions">
          <button className="cl-btn cl-btn-brass" onClick={() => runGenerate()}>Generate schedule</button>
          <button className="cl-btn cl-btn-ghost" onClick={shuffleAndGenerate}>Shuffle order &amp; regenerate</button>
          <button className="cl-btn cl-btn-ghost" onClick={saveConfig}>Save setup</button>
          <button className="cl-btn cl-btn-ghost" onClick={copyForHandoff}>Copy schedule for handoff</button>
        </div>

        {published && (
          <div className="cl-notice no-print">
            This is the published schedule for this league. Anyone who opens this link sees exactly what's
            shown here, so it's safe to print straight from this page.
          </div>
        )}

        {schedule?.issues?.length > 0 && (
          <div className="cl-issues">{schedule.issues.join(" ")}</div>
        )}

        {schedule && !schedule.error && (
          <>
            <div className="cl-section no-print" style={{ textAlign: "right", marginBottom: 12 }}>
              <button className="cl-btn cl-btn-ghost" onClick={() => window.print()}>Print / Save as PDF</button>
            </div>

            <div className="cl-card no-print" style={{ marginBottom: 22 }}>
              <div className="cl-section-title" style={{ marginBottom: 6 }}>Team dropped or added mid-season?</div>
              <p style={{ fontSize: 13.5, color: "var(--ink-soft)", margin: "0 0 12px", lineHeight: 1.5 }}>
                Add or remove the team above first, then enter the first week that hasn't been played/printed
                yet. Every week before that stays exactly as it is now, and only the weeks from there on get
                rebuilt for the new roster, still with no repeat matchups against the locked weeks.
              </p>
              <div className="cl-form-row">
                <input
                  type="number" min="1" max={schedule.weeks.length}
                  className="cl-input cl-input-num"
                  placeholder={`1–${schedule.weeks.length}`}
                  value={amendWeek}
                  onChange={(e) => setAmendWeek(e.target.value)}
                />
                <button className="cl-btn cl-btn-brass" onClick={amendSchedule}>Regenerate from this week</button>
              </div>
            </div>

            <div className="cl-section">
              <div className="cl-section-title">Schedule</div>
              {weeksGrouped.map((wk) => (
                <div className="cl-week" key={wk.weekNumber}>
                  <div className="cl-week-head">Week {wk.weekNumber}</div>
                  {wk.nights.map((night) => (
                    <div className="cl-night" key={night.round}>
                      <div className="cl-night-date">{formatDate(night.date)} · Leg {night.leg}</div>
                      {night.matches.map((m, i) => (
                        <div className="cl-match" key={i}>
                          <span className="cl-side"><span className="cl-team-name">{teamsById[m.homeId]?.name}</span><span className="cl-badge-home">HOME</span></span>
                          <span className="cl-vs">vs</span>
                          <span className="cl-side"><span className="cl-badge-away">AWAY</span><span className="cl-team-name">{teamsById[m.awayId]?.name}</span></span>
                          <span className="cl-venue">{barsById[m.barId]?.name}{m.sharedBar ? " (shared home)" : ""}</span>
                        </div>
                      ))}
                      {night.byeId && <div className="cl-bye">{teamsById[night.byeId]?.name} has the bye this round.</div>}
                      <div className="cl-dots">
                        {bars.filter((b) => night.barUsage[b.id] > 0).map((b) => (
                          <div className="cl-dot-group" key={b.id}>
                            {b.name}
                            <span className="cl-dot-icons">
                              {Array.from({ length: b.tables }).map((_, di) => (
                                <span key={di} className="cl-dot" style={{ background: di < night.barUsage[b.id] ? "#4e7ac7" : "transparent" }} />
                              ))}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>

            <div className="cl-section">
              <div className="cl-section-title">Home / away balance</div>
              <div className="cl-card">
                <table className="cl-summary-table">
                  <thead><tr><th>Team</th><th>Home bar</th><th>Home games</th><th>Away games</th></tr></thead>
                  <tbody>
                    {teams.map((t) => (
                      <tr key={t.id}>
                        <td>{t.name}</td>
                        <td>{barsById[t.barId]?.name}</td>
                        <td>{schedule.teamState[t.id]?.homeCount ?? 0}</td>
                        <td>{schedule.teamState[t.id]?.awayCount ?? 0}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ---------- access gate wrapper ----------
const noCacheFetch = (url) =>
  fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }).then((r) => r.json());

function AccessGate() {
  const [state, setState] = useState({ status: "loading" });
  const [codeInput, setCodeInput] = useState("");
  const [error, setError] = useState("");

  const leagueSlug = new URLSearchParams(window.location.search).get("league");
  const accessCodeKey = "cl-access-code-" + (leagueSlug || "default");
  const storageKey = "chalk-line-config-" + (leagueSlug || "default");

  useEffect(() => {
    // No ?league= in the URL: fall back to the single legacy CONFIG_URL gate.
    if (!leagueSlug) {
      const configured = window.CONFIG_URL && !window.CONFIG_URL.includes("PASTE_YOUR");
      if (!configured) { setState({ status: "unconfigured" }); return; }
      noCacheFetch(window.CONFIG_URL)
        .then((data) => applyConfig(data))
        .catch(() => setState({ status: "config-error" }));
      return;
    }

    // ?league=<slug>: look the slug up in the shared league directory, then
    // fetch that league's own access gist.
    const leaguesConfigured = window.LEAGUES_URL && !window.LEAGUES_URL.includes("PASTE_YOUR");
    if (!leaguesConfigured) { setState({ status: "unconfigured" }); return; }
    noCacheFetch(window.LEAGUES_URL)
      .then((directory) => {
        const leagueConfigUrl = directory[leagueSlug];
        if (!leagueConfigUrl) { setState({ status: "unknown-league" }); return; }
        return noCacheFetch(leagueConfigUrl).then((data) => applyConfig(data));
      })
      .catch(() => setState({ status: "config-error" }));
  }, [leagueSlug]);

  const applyConfig = (data) => {
    const cfg = { open: !!data.open, code: String(data.code ?? "") };
    const savedCode = sessionStorage.getItem(accessCodeKey);
    if (cfg.open && savedCode && savedCode === cfg.code) {
      setState({ status: "in" });
    } else if (cfg.open) {
      setState({ status: "needs-code", code: cfg.code });
    } else {
      setState({ status: "closed" });
    }
  };

  const tryCode = () => {
    if (codeInput === state.code) {
      sessionStorage.setItem(accessCodeKey, codeInput);
      setState({ status: "in" });
    } else {
      setError("That code didn't match. Try again.");
    }
  };

  if (state.status === "loading") {
    return <div className="cl-gate"><p className="cl-gate-text">Checking access…</p></div>;
  }
  if (state.status === "config-error") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Couldn't check access</p>
        <p className="cl-gate-text">Something went wrong reaching the access settings. Try reloading the page.</p>
        <button className="cl-gate-btn" onClick={() => window.location.reload()}>Reload</button>
      </div>
    );
  }
  if (state.status === "closed") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Not open right now</p>
        <p className="cl-gate-text">This tool isn't open for testing at the moment. Check back soon.</p>
      </div>
    );
  }
  if (state.status === "unknown-league") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Link not recognized</p>
        <p className="cl-gate-text">This league link doesn't match anything set up yet. Double-check the link you were sent.</p>
      </div>
    );
  }
  if (state.status === "needs-code") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Enter the access code</p>
        <p className="cl-gate-text">Ask whoever sent you this link for the current code.</p>
        {error && <p className="cl-gate-error">{error}</p>}
        <input className="cl-gate-input" value={codeInput} maxLength={20}
          onChange={(e) => { setCodeInput(e.target.value); setError(""); }}
          onKeyDown={(e) => e.key === "Enter" && tryCode()} autoFocus />
        <div><button className="cl-gate-btn" onClick={tryCode}>Enter</button></div>
      </div>
    );
  }
  // "in" or "unconfigured"
  return (
    <div>
      {state.status === "unconfigured" && (
        <div className="cl-notice" style={{ maxWidth: 880, margin: "0 auto 16px" }}>
          Access control isn't wired up yet — this page is open to anyone with the link. See the setup
          comment near the top of this file to lock it down with a code you control.
        </div>
      )}
      <ChalkLineScheduler storageKey={storageKey} leagueSlug={leagueSlug} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AccessGate />);
</script>
</body>
</html>
