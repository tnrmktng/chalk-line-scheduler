<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ---------- icons (plain SVG, no external icon library needed) ----------
const Icon = {
  Lock: () => (
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" strokeWidth="1.8">
      <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
  ),
};

// ---------- scheduling helpers ----------
const uid = () => Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toISOString().slice(0, 10);
const addDays = (isoDate, days) => {
  const d = new Date(isoDate + "T00:00:00");
  d.setDate(d.getDate() + Math.round(days));
  return d;
};
const formatDate = (d) => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

// Walks forward from startDate at the given weekly cadence, skipping any
// date that falls in blackoutSet (e.g. holiday weeks), until `count` play
// dates have been collected.
function computePlayDates(startDate, matchesPerWeek, blackoutSet, count) {
  const dates = [];
  let stepIndex = 0;
  while (dates.length < count && stepIndex < count * 4 + 52) {
    const dayOffset = stepIndex * (7 / matchesPerWeek);
    const d = addDays(startDate, dayOffset);
    stepIndex++;
    if (blackoutSet.has(d.toISOString().slice(0, 10))) continue;
    dates.push(d);
  }
  return dates;
}

const wantsHome = (state) => {
  const balance = state.awayCount - state.homeCount;
  const streakBonus = state.lastVenue === "away" ? 0.5 : state.lastVenue === "home" ? -0.5 : 0;
  return balance + streakBonus;
};

function generateRoundRobinPairs(teamIds) {
  const hasBye = teamIds.length % 2 !== 0;
  let arr = hasBye ? [...teamIds, null] : [...teamIds];
  const n = arr.length;
  const half = n / 2;
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < half; i++) {
      const a = arr[i];
      const b = arr[n - 1 - i];
      if (a !== null && b !== null) pairs.push([a, b]);
    }
    rounds.push(pairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  return rounds;
}

function backtrackAssign(freeMatches, teamsById, capacity, teamState) {
  const cap = { ...capacity };
  const results = new Array(freeMatches.length);
  const tightness = (m) => (cap[teamsById[m.a].barId] ?? 0) + (cap[teamsById[m.b].barId] ?? 0);
  const order = freeMatches.map((m, i) => ({ m, i })).sort((x, y) => tightness(x.m) - tightness(y.m));

  function optionOrder(m) {
    const scoreA = wantsHome(teamState[m.a]);
    const scoreB = wantsHome(teamState[m.b]);
    return scoreA >= scoreB ? [m.a, m.b] : [m.b, m.a];
  }

  function solve(pos) {
    if (pos === order.length) return true;
    const { m, i } = order[pos];
    const [first, second] = optionOrder(m);
    for (const hostId of [first, second]) {
      const bar = teamsById[hostId].barId;
      if ((cap[bar] ?? 0) > 0) {
        cap[bar] -= 1;
        results[i] = { a: m.a, b: m.b, hostId };
        if (solve(pos + 1)) return true;
        cap[bar] += 1;
        results[i] = undefined;
      }
    }
    return false;
  }

  const ok = solve(0);
  if (!ok) {
    order.forEach(({ m, i }) => {
      if (!results[i]) {
        const [first] = optionOrder(m);
        results[i] = { a: m.a, b: m.b, hostId: first };
      }
    });
  }
  return { ok, matches: results };
}

function buildSchedule(teams, bars, settings) {
  if (teams.length < 2) return { error: "Add at least two teams before generating a schedule." };
  if (settings.format === "random") {
    const weeksCount = Math.max(1, Number(settings.weeks) || 1);
    return buildRandomSchedule(teams, bars, weeksCount);
  }
  return buildRoundRobinSchedule(teams, bars, settings);
}

function buildRoundRobinSchedule(teams, bars, settings) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const singleRounds = generateRoundRobinPairs(teams.map((t) => t.id));
  const sequence = settings.format === "doubleRound" ? [...singleRounds, ...singleRounds] : singleRounds;

  const teamState = {};
  teams.forEach((t) => (teamState[t.id] = { homeCount: 0, awayCount: 0, lastVenue: null }));
  const pairHistory = {};
  const weeks = [];
  const issues = [];

  sequence.forEach((pairs, idx) => {
    const leg = settings.format === "doubleRound" ? (idx < singleRounds.length ? 1 : 2) : 1;
    const capacityLeft = {};
    bars.forEach((b) => (capacityLeft[b.id] = b.tables));

    const decided = [];
    const free = [];
    pairs.forEach(([a, b]) => {
      const ta = teamsById[a], tb = teamsById[b];
      const key = [a, b].sort().join("|");
      if (leg === 2 && pairHistory[key]) {
        const firstHost = pairHistory[key];
        const hostId = firstHost === a ? b : a;
        decided.push({ a, b, hostId, sharedBar: ta.barId === tb.barId });
      } else if (ta.barId === tb.barId) {
        decided.push({ a, b, hostId: null, sharedBar: true });
      } else {
        free.push({ a, b });
      }
    });

    decided.forEach((m) => {
      if (m.hostId) capacityLeft[teamsById[m.hostId].barId] = (capacityLeft[teamsById[m.hostId].barId] ?? 0) - 1;
    });
    decided.filter((m) => !m.hostId).forEach((m) => {
      capacityLeft[teamsById[m.a].barId] = (capacityLeft[teamsById[m.a].barId] ?? 0) - 1;
      const prefA = wantsHome(teamState[m.a]);
      const prefB = wantsHome(teamState[m.b]);
      m.hostId = prefA >= prefB ? m.a : m.b;
    });

    const assigned = backtrackAssign(free, teamsById, capacityLeft, teamState);
    if (!assigned.ok) issues.push(`Round ${idx + 1}: table limits were tight — one match may need a manual swap.`);

    const allMatches = [...decided, ...assigned.matches];
    const barUsage = {};
    bars.forEach((b) => (barUsage[b.id] = 0));
    allMatches.forEach((m) => { barUsage[teamsById[m.hostId].barId] = (barUsage[teamsById[m.hostId].barId] ?? 0) + 1; });

    allMatches.forEach((m) => {
      const hostId = m.hostId;
      const guestId = m.a === hostId ? m.b : m.a;
      teamState[hostId].homeCount += 1; teamState[hostId].lastVenue = "home";
      teamState[guestId].awayCount += 1; teamState[guestId].lastVenue = "away";
      const key = [m.a, m.b].sort().join("|");
      if (!pairHistory[key]) pairHistory[key] = hostId;
    });

    const involved = new Set();
    pairs.forEach(([a, b]) => { involved.add(a); involved.add(b); });
    const byeTeam = teams.find((t) => !involved.has(t.id));

    weeks.push({
      round: idx + 1, leg,
      matches: allMatches.map((m) => ({
        homeId: m.hostId, awayId: m.a === m.hostId ? m.b : m.a,
        barId: teamsById[m.hostId].barId, sharedBar: !!m.sharedBar,
      })),
      byeId: byeTeam ? byeTeam.id : null,
      barUsage,
    });
  });

  return { weeks, teamState, issues };
}

// "Random matchups" — not everyone plays everyone, but no pair should ever
// repeat. A full round-robin (generateRoundRobinPairs) already guarantees
// every pair meets exactly once across all of its rounds; taking a shuffled
// subset of those rounds gives a random-feeling season that still can never
// repeat a matchup, and naturally leaves some pairs unplayed if weeksCount
// is fewer than the full round-robin length. Bye rotates fairly for the same
// reason: each team sits out exactly one round across the full round-robin.
function buildRandomSchedule(teams, bars, weeksCount) {
  const teamsById = Object.fromEntries(teams.map((t) => [t.id, t]));
  const allRounds = generateRoundRobinPairs(teams.map((t) => t.id));
  const shuffled = [...allRounds];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const sequence = shuffled.slice(0, Math.min(weeksCount, shuffled.length));

  const teamState = {};
  teams.forEach((t) => (teamState[t.id] = { homeCount: 0, awayCount: 0, lastVenue: null }));
  const weeks = [];
  const issues = [];
  if (weeksCount > allRounds.length) {
    issues.push(`With ${teams.length} teams, only ${allRounds.length} weeks are possible without repeating a matchup — showing ${allRounds.length} weeks instead of ${weeksCount}.`);
  }

  sequence.forEach((pairs, idx) => {
    const capacityLeft = {};
    bars.forEach((b) => (capacityLeft[b.id] = b.tables));

    const decided = [];
    const free = [];
    pairs.forEach(([a, b]) => {
      const ta = teamsById[a], tb = teamsById[b];
      if (ta.barId === tb.barId) {
        decided.push({ a, b, hostId: null, sharedBar: true });
      } else {
        free.push({ a, b });
      }
    });

    decided.forEach((m) => {
      const prefA = wantsHome(teamState[m.a]);
      const prefB = wantsHome(teamState[m.b]);
      m.hostId = prefA >= prefB ? m.a : m.b;
      capacityLeft[teamsById[m.hostId].barId] = (capacityLeft[teamsById[m.hostId].barId] ?? 0) - 1;
    });

    const assigned = backtrackAssign(free, teamsById, capacityLeft, teamState);
    if (!assigned.ok) issues.push(`Week ${idx + 1}: table limits were tight — one match may need a manual swap.`);

    const allMatches = [...decided, ...assigned.matches];
    const barUsage = {};
    bars.forEach((b) => (barUsage[b.id] = 0));
    allMatches.forEach((m) => { barUsage[teamsById[m.hostId].barId] = (barUsage[teamsById[m.hostId].barId] ?? 0) + 1; });

    allMatches.forEach((m) => {
      const hostId = m.hostId;
      const guestId = m.a === hostId ? m.b : m.a;
      teamState[hostId].homeCount += 1; teamState[hostId].lastVenue = "home";
      teamState[guestId].awayCount += 1; teamState[guestId].lastVenue = "away";
    });

    const involved = new Set();
    pairs.forEach(([a, b]) => { involved.add(a); involved.add(b); });
    const byeTeam = teams.find((t) => !involved.has(t.id));

    weeks.push({
      round: idx + 1, leg: 1,
      matches: allMatches.map((m) => ({
        homeId: m.hostId, awayId: m.a === m.hostId ? m.b : m.a,
        barId: teamsById[m.hostId].barId, sharedBar: !!m.sharedBar,
      })),
      byeId: byeTeam ? byeTeam.id : null,
      barUsage,
    });
  });

  return { weeks, teamState, issues };
}

// ---------- main scheduler app ----------
function ChalkLineScheduler({ storageKey }) {
  const [bars, setBars] = useState(seedBars);
  const [teams, setTeams] = useState(seedTeams);
  const [settings, setSettings] = useState({
    matchesPerWeek: 1,
    format: "random",
    startDate: "2026-09-10",
    weeks: 26,
    blackoutDates: ["2026-11-26", "2026-12-24", "2026-12-31"],
  });
  const [barName, setBarName] = useState("");
  const [barTables, setBarTables] = useState(1);
  const [teamName, setTeamName] = useState("");
  const [teamBar, setTeamBar] = useState("");
  const [schedule, setSchedule] = useState(null);
  const [notice, setNotice] = useState(null);
  const [blackoutInput, setBlackoutInput] = useState("");

  useEffect(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.bars) setBars(parsed.bars);
        if (parsed.teams) setTeams(parsed.teams);
        if (parsed.settings) {
          // Migrate configs saved before "format" replaced the doubleRound boolean.
          const s = parsed.settings;
          const format = s.format || (s.doubleRound ? "doubleRound" : "singleRound");
          setSettings((prev) => ({ ...prev, ...s, format }));
        }
        if (parsed.schedule) setSchedule(parsed.schedule);
      }
    } catch (e) { /* no saved config yet */ }
  }, [storageKey]);

  const barsById = useMemo(() => Object.fromEntries(bars.map((b) => [b.id, b])), [bars]);
  const teamsById = useMemo(() => Object.fromEntries(teams.map((t) => [t.id, t])), [teams]);

  const flash = (msg) => { setNotice(msg); setTimeout(() => setNotice(null), 3200); };

  const addBar = () => {
    if (!barName.trim()) return;
    setBars((prev) => [...prev, { id: uid(), name: barName.trim(), tables: Math.max(1, Number(barTables) || 1) }]);
    setBarName(""); setBarTables(1);
  };
  const removeBar = (id) => {
    if (teams.some((t) => t.barId === id)) { flash("Move or remove that bar's teams first — a bar in use can't be deleted."); return; }
    setBars((prev) => prev.filter((b) => b.id !== id));
  };
  const addTeam = () => {
    if (!teamName.trim()) return;
    const barId = teamBar || bars[0]?.id;
    if (!barId) { flash("Add a bar before adding a team."); return; }
    setTeams((prev) => [...prev, { id: uid(), name: teamName.trim(), barId }]);
    setTeamName("");
  };
  const removeTeam = (id) => setTeams((prev) => prev.filter((t) => t.id !== id));

  const runGenerate = useCallback((teamOrder) => {
    const result = buildSchedule(teamOrder ?? teams, bars, settings);
    if (result.error) { flash(result.error); setSchedule(null); return; }
    setSchedule(result);
  }, [teams, bars, settings]);

  const shuffleAndGenerate = () => {
    const shuffled = [...teams];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    runGenerate(shuffled);
  };

  const saveConfig = () => {
    try {
      localStorage.setItem(storageKey, JSON.stringify({ bars, teams, settings, schedule }));
      flash("Setup saved to this browser. It'll be here next time you open this page here.");
    } catch (e) { flash("Couldn't save right now — try again in a moment."); }
  };

  const weeksGrouped = useMemo(() => {
    if (!schedule) return [];
    const blackoutSet = new Set(settings.blackoutDates || []);
    const playDates = computePlayDates(settings.startDate, settings.matchesPerWeek, blackoutSet, schedule.weeks.length);
    const perWeek = {};
    schedule.weeks.forEach((w, i) => {
      const weekIdx = Math.floor((w.round - 1) / settings.matchesPerWeek);
      if (!perWeek[weekIdx]) perWeek[weekIdx] = [];
      perWeek[weekIdx].push({ ...w, date: playDates[i] });
    });
    return Object.keys(perWeek).sort((a, b) => Number(a) - Number(b))
      .map((k) => ({ weekNumber: Number(k) + 1, nights: perWeek[k] }));
  }, [schedule, settings]);

  return (
    <div className="cl-app">
      <div className="cl-header">
        <p className="cl-title">Chalk Line</p>
        <p className="cl-subtitle">Home-and-away scheduling for pool leagues where bars share tables and teams share bars.</p>
      </div>
      <div className="cl-body">
        {notice && <div className="cl-notice">{notice}</div>}

        <div className="cl-grid-2">
          <div className="cl-section">
            <div className="cl-section-title">Bars &amp; tables</div>
            <div className="cl-card">
              {bars.length === 0 && <div className="cl-empty">Add the bars your teams play out of.</div>}
              {bars.map((b) => (
                <div className="cl-row" key={b.id}>
                  <div className="cl-row-main">
                    <span>{b.name}</span>
                    <span className="cl-tag">{b.tables} table{b.tables === 1 ? "" : "s"}</span>
                  </div>
                  <button className="cl-icon-btn" onClick={() => removeBar(b.id)}>✕</button>
                </div>
              ))}
              <div className="cl-form-row">
                <input className="cl-input cl-input-name" placeholder="Bar name" value={barName}
                  onChange={(e) => setBarName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addBar()} />
                <input type="number" min="1" className="cl-input cl-input-num" value={barTables}
                  onChange={(e) => setBarTables(e.target.value)} />
                <button className="cl-btn cl-btn-ghost" onClick={addBar}>+ Add</button>
              </div>
            </div>
          </div>

          <div className="cl-section">
            <div className="cl-section-title">Teams</div>
            <div className="cl-card">
              {teams.length === 0 && <div className="cl-empty">Add teams and pick which bar each one calls home.</div>}
              {teams.map((t) => (
                <div className="cl-row" key={t.id}>
                  <div className="cl-row-main">
                    <span>{t.name}</span>
                    <span className="cl-tag">{barsById[t.barId]?.name ?? "no bar"}</span>
                  </div>
                  <button className="cl-icon-btn" onClick={() => removeTeam(t.id)}>✕</button>
                </div>
              ))}
              <div className="cl-form-row">
                <input className="cl-input cl-input-name" placeholder="Team name" value={teamName}
                  onChange={(e) => setTeamName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTeam()} />
                <select className="cl-select" value={teamBar} onChange={(e) => setTeamBar(e.target.value)}>
                  <option value="">Home bar…</option>
                  {bars.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
                <button className="cl-btn cl-btn-ghost" onClick={addTeam}>+ Add</button>
              </div>
            </div>
          </div>
        </div>

        <div className="cl-section">
          <div className="cl-section-title">Season settings</div>
          <div className="cl-card cl-settings-row">
            <div className="cl-settings-group">
              <span className="cl-settings-label">Nights per week</span>
              <div className="cl-radio-set">
                <label className="cl-radio-opt"><input type="radio" checked={settings.matchesPerWeek === 1}
                  onChange={() => setSettings((s) => ({ ...s, matchesPerWeek: 1 }))} /> Weekly</label>
                <label className="cl-radio-opt"><input type="radio" checked={settings.matchesPerWeek === 2}
                  onChange={() => setSettings((s) => ({ ...s, matchesPerWeek: 2 }))} /> Twice a week</label>
              </div>
            </div>
            <div className="cl-settings-group">
              <span className="cl-settings-label">Season format</span>
              <div className="cl-radio-set">
                <label className="cl-radio-opt"><input type="radio" checked={settings.format === "doubleRound"}
                  onChange={() => setSettings((s) => ({ ...s, format: "doubleRound" }))} /> Home &amp; away (play everyone twice)</label>
                <label className="cl-radio-opt"><input type="radio" checked={settings.format === "singleRound"}
                  onChange={() => setSettings((s) => ({ ...s, format: "singleRound" }))} /> Single round (once each)</label>
                <label className="cl-radio-opt"><input type="radio" checked={settings.format === "random"}
                  onChange={() => setSettings((s) => ({ ...s, format: "random" }))} /> Random matchups (not everyone plays everyone)</label>
              </div>
            </div>
            <div className="cl-settings-group">
              <span className="cl-settings-label">First match night</span>
              <input type="date" className="cl-input" value={settings.startDate}
                onChange={(e) => setSettings((s) => ({ ...s, startDate: e.target.value }))} />
            </div>
            {settings.format === "random" && (
              <div className="cl-settings-group">
                <span className="cl-settings-label">Number of weeks</span>
                <input type="number" min="1" className="cl-input cl-input-num" value={settings.weeks}
                  onChange={(e) => setSettings((s) => ({ ...s, weeks: e.target.value }))} />
              </div>
            )}
          </div>
          {settings.format === "random" && (
            <div className="cl-card" style={{ marginTop: 12 }}>
              <span className="cl-settings-label">Weeks off (holidays, etc.)</span>
              <div className="cl-form-row" style={{ flexWrap: "wrap", marginTop: 8 }}>
                {(settings.blackoutDates || []).map((d) => (
                  <span className="cl-tag" key={d} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                    {d}
                    <button type="button" className="cl-icon-btn" style={{ padding: "0 2px" }}
                      onClick={() => setSettings((s) => ({ ...s, blackoutDates: s.blackoutDates.filter((x) => x !== d) }))}>✕</button>
                  </span>
                ))}
              </div>
              <div className="cl-form-row">
                <input type="date" className="cl-input" value={blackoutInput}
                  onChange={(e) => setBlackoutInput(e.target.value)} />
                <button type="button" className="cl-btn cl-btn-ghost" onClick={() => {
                  if (!blackoutInput) return;
                  setSettings((s) => ({
                    ...s,
                    blackoutDates: [...new Set([...(s.blackoutDates || []), blackoutInput])].sort(),
                  }));
                  setBlackoutInput("");
                }}>+ Add</button>
              </div>
            </div>
          )}
        </div>

        <div className="cl-actions">
          <button className="cl-btn cl-btn-brass" onClick={() => runGenerate()}>Generate schedule</button>
          <button className="cl-btn cl-btn-ghost" onClick={shuffleAndGenerate}>Shuffle order &amp; regenerate</button>
          <button className="cl-btn cl-btn-ghost" onClick={saveConfig}>Save setup</button>
        </div>

        {schedule?.issues?.length > 0 && (
          <div className="cl-issues">{schedule.issues.join(" ")}</div>
        )}

        {schedule && !schedule.error && (
          <>
            <div className="cl-section no-print" style={{ textAlign: "right", marginBottom: 12 }}>
              <button className="cl-btn cl-btn-ghost" onClick={() => window.print()}>Print / Save as PDF</button>
            </div>
            <div className="cl-section">
              <div className="cl-section-title">Schedule</div>
              {weeksGrouped.map((wk) => (
                <div className="cl-week" key={wk.weekNumber}>
                  <div className="cl-week-head">Week {wk.weekNumber}</div>
                  {wk.nights.map((night) => (
                    <div className="cl-night" key={night.round}>
                      <div className="cl-night-date">{formatDate(night.date)} · Leg {night.leg}</div>
                      {night.matches.map((m, i) => (
                        <div className="cl-match" key={i}>
                          <span className="cl-side">{teamsById[m.homeId]?.name}<span className="cl-badge-home">HOME</span></span>
                          <span className="cl-vs">vs</span>
                          <span className="cl-side">{teamsById[m.awayId]?.name}<span className="cl-badge-away">AWAY</span></span>
                          <span className="cl-venue">{barsById[m.barId]?.name}{m.sharedBar ? " (shared home)" : ""}</span>
                        </div>
                      ))}
                      {night.byeId && <div className="cl-bye">{teamsById[night.byeId]?.name} has the bye this round.</div>}
                      <div className="cl-dots">
                        {bars.filter((b) => night.barUsage[b.id] > 0).map((b) => (
                          <div className="cl-dot-group" key={b.id}>
                            {b.name}
                            <span className="cl-dot-icons">
                              {Array.from({ length: b.tables }).map((_, di) => (
                                <span key={di} className="cl-dot" style={{ background: di < night.barUsage[b.id] ? "#4e7ac7" : "transparent" }} />
                              ))}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>

            <div className="cl-section">
              <div className="cl-section-title">Home / away balance</div>
              <div className="cl-card">
                <table className="cl-summary-table">
                  <thead><tr><th>Team</th><th>Home bar</th><th>Home games</th><th>Away games</th></tr></thead>
                  <tbody>
                    {teams.map((t) => (
                      <tr key={t.id}>
                        <td>{t.name}</td>
                        <td>{barsById[t.barId]?.name}</td>
                        <td>{schedule.teamState[t.id]?.homeCount ?? 0}</td>
                        <td>{schedule.teamState[t.id]?.awayCount ?? 0}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ---------- access gate wrapper ----------
const noCacheFetch = (url) =>
  fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }).then((r) => r.json());

function AccessGate() {
  const [state, setState] = useState({ status: "loading" });
  const [codeInput, setCodeInput] = useState("");
  const [error, setError] = useState("");

  const leagueSlug = new URLSearchParams(window.location.search).get("league");
  const accessCodeKey = "cl-access-code-" + (leagueSlug || "default");
  const storageKey = "chalk-line-config-" + (leagueSlug || "default");

  useEffect(() => {
    // No ?league= in the URL: fall back to the single legacy CONFIG_URL gate.
    if (!leagueSlug) {
      const configured = window.CONFIG_URL && !window.CONFIG_URL.includes("PASTE_YOUR");
      if (!configured) { setState({ status: "unconfigured" }); return; }
      noCacheFetch(window.CONFIG_URL)
        .then((data) => applyConfig(data))
        .catch(() => setState({ status: "config-error" }));
      return;
    }

    // ?league=<slug>: look the slug up in the shared league directory, then
    // fetch that league's own access gist.
    const leaguesConfigured = window.LEAGUES_URL && !window.LEAGUES_URL.includes("PASTE_YOUR");
    if (!leaguesConfigured) { setState({ status: "unconfigured" }); return; }
    noCacheFetch(window.LEAGUES_URL)
      .then((directory) => {
        const leagueConfigUrl = directory[leagueSlug];
        if (!leagueConfigUrl) { setState({ status: "unknown-league" }); return; }
        return noCacheFetch(leagueConfigUrl).then((data) => applyConfig(data));
      })
      .catch(() => setState({ status: "config-error" }));
  }, [leagueSlug]);

  const applyConfig = (data) => {
    const cfg = { open: !!data.open, code: String(data.code ?? "") };
    const savedCode = sessionStorage.getItem(accessCodeKey);
    if (cfg.open && savedCode && savedCode === cfg.code) {
      setState({ status: "in" });
    } else if (cfg.open) {
      setState({ status: "needs-code", code: cfg.code });
    } else {
      setState({ status: "closed" });
    }
  };

  const tryCode = () => {
    if (codeInput === state.code) {
      sessionStorage.setItem(accessCodeKey, codeInput);
      setState({ status: "in" });
    } else {
      setError("That code didn't match. Try again.");
    }
  };

  if (state.status === "loading") {
    return <div className="cl-gate"><p className="cl-gate-text">Checking access…</p></div>;
  }
  if (state.status === "config-error") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Couldn't check access</p>
        <p className="cl-gate-text">Something went wrong reaching the access settings. Try reloading the page.</p>
        <button className="cl-gate-btn" onClick={() => window.location.reload()}>Reload</button>
      </div>
    );
  }
  if (state.status === "closed") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Not open right now</p>
        <p className="cl-gate-text">This tool isn't open for testing at the moment. Check back soon.</p>
      </div>
    );
  }
  if (state.status === "unknown-league") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Link not recognized</p>
        <p className="cl-gate-text">This league link doesn't match anything set up yet. Double-check the link you were sent.</p>
      </div>
    );
  }
  if (state.status === "needs-code") {
    return (
      <div className="cl-gate">
        <div className="cl-gate-lock"><Icon.Lock /></div>
        <p className="cl-gate-title">Enter the access code</p>
        <p className="cl-gate-text">Ask whoever sent you this link for the current code.</p>
        {error && <p className="cl-gate-error">{error}</p>}
        <input className="cl-gate-input" value={codeInput} maxLength={20}
          onChange={(e) => { setCodeInput(e.target.value); setError(""); }}
          onKeyDown={(e) => e.key === "Enter" && tryCode()} autoFocus />
        <div><button className="cl-gate-btn" onClick={tryCode}>Enter</button></div>
      </div>
    );
  }
  // "in" or "unconfigured"
  return (
    <div>
      {state.status === "unconfigured" && (
        <div className="cl-notice" style={{ maxWidth: 880, margin: "0 auto 16px" }}>
          Access control isn't wired up yet — this page is open to anyone with the link. See the setup
          comment near the top of this file to lock it down with a code you control.
        </div>
      )}
      <ChalkLineScheduler storageKey={storageKey} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AccessGate />);
</script>
